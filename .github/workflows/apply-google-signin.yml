name: Apply Google Sign-In

on:
  push:
    branches:
      - feat/google-sign-in

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[google-signin-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply integration
        shell: bash
        env:
          ACCOUNTS_GZ_B64: 
          EDIT_GZ_B64: 
        run: |
          python - <<'PY'
          import base64, gzip, os
          from pathlib import Path
          Path('lib/models/gemini').mkdir(parents=True, exist_ok=True)
          Path('lib/models/gemini/gemini_accounts_io.dart').write_bytes(
              gzip.decompress(base64.b64decode(os.environ['ACCOUNTS_GZ_B64']))
          )
          Path('/tmp/apply_existing.py').write_bytes(
              gzip.decompress(base64.b64decode(os.environ['EDIT_GZ_B64']))
          )
          PY
          python /tmp/apply_existing.py .
          git diff --check
          rm -f .github/workflows/apply-google-signin.yml

      - name: Commit applied integration
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(models): add Google Gemini sign-in [google-signin-applied]"
          git push
