name: Build Windows Google Sign-In

on:
  push:
    branches: [feat/google-sign-in]
    paths:
      - '.github/workflows/build-windows-google.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  FLUTTER_VERSION: 3.47.5

jobs:
  remote:
    name: Remote server
    uses: ./.github/workflows/remote.yml

  windows:
    name: Build Windows installer
    needs: remote
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y
      - uses: actions/download-artifact@v4
        with:
          name: remote
          path: build/remote
      - name: Resolve Gemini CLI OAuth client id
        shell: pwsh
        run: |
          $url = 'https://raw.githubusercontent.com/google-gemini/gemini-cli/main/packages/core/src/code_assist/oauth2.ts'
          $text = (Invoke-WebRequest -UseBasicParsing $url).Content
          $match = [regex]::Match($text, "const OAUTH_CLIENT_ID\s*=\s*['\"\r\n ]+([^'\";\r\n ]+)")
          if (-not $match.Success) { throw 'Could not resolve Gemini CLI OAuth client id' }
          "GOOGLE_OAUTH_CLIENT_ID=$($match.Groups[1].Value)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Build Flutter Windows bundle with Google OAuth
        shell: pwsh
        run: flutter build windows --release --dart-define="BAOCODE_GOOGLE_OAUTH_CLIENT_ID=$env:GOOGLE_OAUTH_CLIENT_ID"
      - name: Package BaoCode installer
        run: dart run tool/build_windows.dart --skip-build --remote-built
      - uses: actions/upload-artifact@v4
        with:
          name: baocode-windows-google-signin
          if-no-files-found: error
          retention-days: 7
          path: build/installers/BaoCode-*-setup.exe
