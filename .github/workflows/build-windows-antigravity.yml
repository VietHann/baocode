name: Build Windows Antigravity

on:
  push:
    branches: [feat/google-sign-in]
    paths:
      - '.github/workflows/build-windows-antigravity.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  FLUTTER_VERSION: 3.47.5

jobs:
  remote:
    name: Remote server
    uses: ./.github/workflows/remote.yml

  windows:
    name: Build Windows installer
    needs: remote
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - uses: actions/download-artifact@v4
        with:
          name: remote
          path: build/remote

      - name: Resolve official Antigravity OAuth client at build time
        shell: pwsh
        run: |
          $url = 'https://raw.githubusercontent.com/leookun/cursor-byok/main/server/plugins/build-in/antigravity-auth/google_oauth.ts'
          $text = (Invoke-WebRequest -UseBasicParsing $url).Content

          function Read-Part([string]$name) {
            $m = [regex]::Match($text, ('const\s+' + [regex]::Escape($name) + '\s*=\s*"([^"]+)"'))
            if (-not $m.Success) { throw "Could not resolve $name from Antigravity source" }
            return $m.Groups[1].Value
          }

          $p1 = Read-Part '_P1'
          $p2 = Read-Part '_P2'
          $p3 = Read-Part '_P3'
          $s1 = Read-Part '_S1'
          $s2 = Read-Part '_S2'

          $clientId = ("$p1-$p2-$p3").Replace('-apps', '.apps')
          $clientSecret = "$s1-$s2"

          if ([string]::IsNullOrWhiteSpace($clientId) -or [string]::IsNullOrWhiteSpace($clientSecret)) {
            throw 'Antigravity OAuth credentials resolved empty'
          }

          Write-Output "::add-mask::$clientId"
          Write-Output "::add-mask::$clientSecret"
          "BAOCODE_GOOGLE_OAUTH_CLIENT_ID=$clientId" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "BAOCODE_GOOGLE_OAUTH_CLIENT_SECRET=$clientSecret" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host 'Resolved Antigravity OAuth client configuration.'

      - name: Build Flutter Windows release
        shell: pwsh
        run: |
          flutter build windows --release `
            --dart-define="BAOCODE_GOOGLE_OAUTH_CLIENT_ID=$env:BAOCODE_GOOGLE_OAUTH_CLIENT_ID" `
            --dart-define="BAOCODE_GOOGLE_OAUTH_CLIENT_SECRET=$env:BAOCODE_GOOGLE_OAUTH_CLIENT_SECRET"

      - name: Package Windows installer
        run: dart run tool/build_windows.dart --skip-build --remote-built

      - name: Verify installer
        shell: pwsh
        run: |
          $files = Get-ChildItem 'build/installers/BaoCode-*-setup.exe'
          if (-not $files) { throw 'BaoCode installer was not produced' }
          $files | ForEach-Object { Write-Host "$($_.FullName) $([math]::Round($_.Length / 1MB, 1)) MB" }

      - uses: actions/upload-artifact@v4
        with:
          name: baocode-windows-antigravity
          if-no-files-found: error
          retention-days: 7
          path: build/installers/BaoCode-*-setup.exe
