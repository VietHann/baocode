name: Draft Vietnamese localization (temporary)

on:
  push:
    branches:
      - feat/vietnamese-localization
    paths:
      - tool/translate_vi.py
      - .github/workflows/translate_vi.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  translate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install translation requirements
        run: python -m pip install 'requests>=2.32,<3'
      - name: Generate Vietnamese draft
        run: python tool/translate_vi.py
      - name: Commit draft to the fork branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/l10n/app_vi.arb
          git diff --cached --quiet || (git commit -m "chore(l10n): generate Vietnamese translation draft" && git push)
