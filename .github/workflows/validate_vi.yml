name: Validate Vietnamese localization (temporary)

on:
  push:
    branches: [work/vietnamese-preparation]
    paths:
      - .github/workflows/validate_vi.yml
      - lib/l10n/app_vi.arb
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-and-test:
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.5'
          cache: true
          pub-cache: true
      - run: flutter pub get
      - run: flutter gen-l10n
      - name: Ensure Dart localization files compile
        run: flutter analyze --fatal-infos
      - name: Locale tests
        run: flutter test test/l10n_test.dart
      - name: Save generated Dart localization files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/l10n/app_localizations.dart lib/l10n/app_localizations_vi.dart
          git diff --cached --quiet || (git commit -m "chore(l10n): generate Vietnamese Flutter localizations" && git push)
