name: Finalize Antigravity port

on:
  push:
    branches: [feat/google-sign-in]
    paths: [.github/workflows/finalize-antigravity.yml]

permissions:
  contents: write

env:
  FLUTTER_VERSION: 3.47.5

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/google-sign-in
      - name: Relabel provider as Antigravity
        shell: python
        run: |
          from pathlib import Path
          replacements = {
            'lib/settings/pages/models_page.dart': [
              ("ProviderProtocol.gemini => 'Google Gemini'", "ProviderProtocol.gemini => 'Google Antigravity'"),
              ("provider = provider.copyWith(name: 'Google Gemini');", "provider = provider.copyWith(name: 'Google Antigravity');"),
              ("'Sign in with Google to use Gemini Code Assist with your Google account quota.'", "'Sign in with Google to use the models Google exposes to your Antigravity account.'"),
            ],
            'lib/models/model_provider.dart': [
              ('/// Google Gemini Code Assist, signed in with a Google account (OAuth).', '/// Google Antigravity, signed in with a Google account (OAuth).'),
            ],
            'lib/models/model_runtime_io.dart': [
              ("/// The app's Google Gemini accounts.", "/// The app's Google Antigravity accounts."),
            ],
            'lib/models/proxy/model_proxy.dart': [
              ("/// Google Gemini Code Assist providers' accounts.", "/// Google Antigravity providers' accounts."),
              ("'Gemini returned an invalid reply'", "'Antigravity returned an invalid reply'"),
            ],
          }
          for path, pairs in replacements.items():
            p = Path(path)
            text = p.read_text(encoding='utf-8')
            for old, new in pairs:
              text = text.replace(old, new)
            p.write_text(text, encoding='utf-8')
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Get dependencies
        run: flutter pub get
      - name: Format changed Dart files
        run: dart format lib/models/gemini lib/models/proxy/translate/gemini_request.dart lib/models/proxy/translate/gemini_response.dart lib/settings/pages/models_page.dart lib/models/model_provider.dart lib/models/model_runtime_io.dart lib/models/proxy/model_proxy.dart
      - name: Analyze Antigravity integration
        run: flutter analyze lib/models/gemini lib/models/proxy/translate/gemini_request.dart lib/models/proxy/translate/gemini_response.dart lib/models/model_runtime_io.dart lib/models/proxy/model_proxy.dart lib/settings/pages/models_page.dart
      - name: Commit finalized port
        run: |
          rm .github/workflows/finalize-antigravity.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix(models): finalize Google Antigravity integration"
          git push origin HEAD:feat/google-sign-in
